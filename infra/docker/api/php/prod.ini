memory_limit = 256M
expose_php = Off

display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr
zend.assertions = -1

; Код в образе неизменен: проверка меток файлов не нужна
opcache.enable = 1
opcache.enable_cli = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files = 30000

; JIT в worker mode даёт прирост на вычислительном коде.
; Если увидишь нестабильность — opcache.jit=disable, это безопасный откат
opcache.jit = tracing
opcache.jit_buffer_size = 128M

realpath_cache_size = 4096K
realpath_cache_ttl = 600
