deptrac:
  paths:
    - ./src
  cache_file: .deptrac.contexts.cache

  layers:
    - name: Shared
      collectors:
        - { type: classLike, value: '^LaravelBoilerplate\\Shared\\' }

    - name: Contracts
      collectors:
        - { type: classLike, value: '^LaravelBoilerplate\\(?!Shared\\)[^\\]+\\Contract\\' }

    # Каждый новый контекст добавляется сюда:
    - name: Identity
      collectors:
        - type: bool
          must:
            - { type: classLike, value: '^LaravelBoilerplate\\Identity\\' }
          must_not:
            - { type: classLike, value: '^LaravelBoilerplate\\Identity\\Contract\\' }


  ruleset:
    Shared: ~
    Contracts: [Shared]
    Identity: [Shared, Contracts]
