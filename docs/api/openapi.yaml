openapi: 3.0.3

info:
  title: Laravel Boilerplate API
  version: 0.1.0
  description: |
    Spec-first API contract.
    Errors follow RFC 9457 and are returned as `application/problem+json`.
    Collections use cursor pagination: `{ items: [...], page: { nextCursor, limit } }`.
  license:
    name: MIT
    url: https://github.com/kalitvyan/laravel-boilerplate/blob/main/LICENSE

servers:
  - url: http://localhost:8000
    description: Local development

tags:
  - name: Ops
    description: Health probes for orchestrators
  - name: Identity
    description: Registration, authentication and user management

paths:
  /health/live:
    $ref: paths/shared/health-live.yaml
  /health/ready:
    $ref: paths/shared/health-ready.yaml
  /api/v1/users:
    $ref: paths/identity/users.yaml
  /api/v1/users/me:
    $ref: paths/identity/users-me.yaml
  /api/v1/users/{userId}/block:
    $ref: paths/identity/users-block.yaml
  /api/v1/auth/login:
    $ref: paths/identity/auth-login.yaml
  /api/v1/auth/refresh:
    $ref: paths/identity/auth-refresh.yaml
  /api/v1/auth/logout:
    $ref: paths/identity/auth-logout.yaml

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Access token issued by /api/v1/auth/login

security:
  - bearerAuth: []
